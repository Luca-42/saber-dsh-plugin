# dsh-plugin-saber bundle patch: inserts the plugin row into the web profile
# roster. Applied as a profile bundle layer (the `dsh.bundle.patch` manifest
# field) over dsh-base.
#
# The row is a bare plugin by package name: the host half (exports ".") runs
# in the host process and registers the saber_* tools.
- insert:
    - id: saber-translator
      name: dsh-plugin-saber
